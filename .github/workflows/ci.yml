name: CI

# Three stages. Linting and testing run in parallel because neither depends
# on the other; the build waits for both, so a package is only ever produced
# from code that passed every check.
#
#   lint ─┐
#         ├─► build
#   test ─┘

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ lint
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.7"

      - name: Lint Python (ruff)
        working-directory: ecrf-prototype/backend
        run: ruff check . --output-format=github

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecrf-prototype/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ecrf-prototype/frontend
        run: npm ci

      - name: Lint TypeScript (eslint)
        working-directory: ecrf-prototype/frontend
        run: npm run lint

  # ------------------------------------------------------------------ test
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        working-directory: ecrf-prototype/backend
        run: pip install -e ".[dev]"

      # ECRF_BACKEND=mock replays a recorded extraction of the bundled
      # sample protocol, so the suite needs no API key and makes no
      # network calls.
      - name: Run tests
        working-directory: ecrf-prototype/backend
        env:
          ECRF_BACKEND: mock
          ECRF_CONTEXT: auto
        run: pytest -v --junitxml=results.xml

      - name: Summarise results
        if: always()
        working-directory: ecrf-prototype/backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("results.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          total = int(s.get("tests", 0)); fail = int(s.get("failures", 0))
          err = int(s.get("errors", 0)); skip = int(s.get("skipped", 0))
          print("## Unit tests\n")
          print(f"| passed | failed | errors | skipped |")
          print(f"| --- | --- | --- | --- |")
          print(f"| {total - fail - err - skip} | {fail} | {err} | {skip} |\n")
          for case in s.iter("testcase"):
              bad = case.find("failure") is not None or case.find("error") is not None
              print(f"- {'FAIL' if bad else 'pass'} `{case.get('name')}`")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ecrf-prototype/backend/results.xml

  # ----------------------------------------------------------------- build
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [lint, test]          # only builds if linting AND testing passed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecrf-prototype/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ecrf-prototype/frontend
        run: npm ci

      # tsc type-checks the whole project, then vite bundles it.
      - name: Compile and bundle
        working-directory: ecrf-prototype/frontend
        run: npm run build

      - name: Report bundle size
        working-directory: ecrf-prototype/frontend
        run: |
          {
            echo "## Build output"
            echo
            echo '```'
            ls -lh dist/assets
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ecrf-prototype/frontend/dist
